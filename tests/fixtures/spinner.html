<!doctype html><html><head><title>Spinner</title>
<style>@keyframes spin{to{transform:rotate(360deg)}} #sp{width:40px;height:40px;border:6px solid #ccc;border-top-color:#36c;border-radius:50%;animation:spin 1s linear infinite}
#box{width:80px;height:20px;background:#6c3;transition:width 400ms linear} #box.wide{width:400px}</style></head>
<body style="font-family:sans-serif;padding:16px"><h1>Perpetual spinner</h1><div id="sp"></div>
<p><button id="counter" onclick="document.getElementById('c').textContent=(+document.getElementById('c').textContent)+1">increment</button> count: <span id="c">0</span></p>
<p><button id="grow" onclick="document.getElementById('box').classList.add('wide')">grow (finite transition)</button></p><div id="box"></div>
</body></html>
