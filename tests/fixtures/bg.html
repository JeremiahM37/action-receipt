<!doctype html><html><head><title>Background activity</title>
<style>
body{margin:0;font-family:sans-serif;padding:16px}
.spinner{display:inline-block;width:16px;height:16px;border:3px solid #bbb;border-top-color:#333;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#raf{width:40px;height:40px;background:#39f}
</style></head>
<body>
<h1>Background activity</h1>
<p>A page that is never still. Query: <code>?bg=fast|raf|css|none</code></p>
<p>fast: <span id="fast">0</span></p>
<p id="spin-wrap"></p>
<div id="raf"></div>
<section><button id="noop">Does nothing</button> <span id="para">plain text</span>
<button id="counter" onclick="document.getElementById('count').textContent=(+document.getElementById('count').textContent)+1">Increment</button> count: <span id="count">0</span></section>
<script>
const bg = new URLSearchParams(location.search).get('bg') || 'none';
if (bg === 'fast') {
  // a 50 ms ticker written with setTimeout re-arming itself (the common pattern), not setInterval
  const tick = () => { const f = document.getElementById('fast'); f.textContent = (+f.textContent) + 1; setTimeout(tick, 50); };
  setTimeout(tick, 50);
} else if (bg === 'css') {
  document.getElementById('spin-wrap').innerHTML = '<span class="spinner"></span> loading...';
} else if (bg === 'raf') {
  let t = 0; const el = document.getElementById('raf');
  const step = () => { t += 0.05; el.style.transform = 'translateX(' + Math.round(100 + 100 * Math.sin(t)) + 'px)'; requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
</script>
</body></html>
