[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "action-receipt"
version = "0.3.0"
description = "Deterministic per-action effect receipts for browser agents, as an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JeremiahM37", email = "JeremiahM37@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "playwright", "browser-agent", "agents", "verification", "receipt", "chromium", "cdp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["mcp>=2", "playwright>=1.50", "Pillow>=10", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]
# The bench only uses the standard library on top of the package itself; the extra exists so
# `pip install -e '.[bench]'` keeps working when a dependency is added.
bench = []
dev = [
  "action-receipt[test,bench]",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
  "pre-commit>=4",
]

[project.scripts]
action-receipt = "action_receipt.server:main"

[project.urls]
Homepage = "https://github.com/JeremiahM37/action-receipt"
Repository = "https://github.com/JeremiahM37/action-receipt"
Issues = "https://github.com/JeremiahM37/action-receipt/issues"
Changelog = "https://github.com/JeremiahM37/action-receipt/blob/main/CHANGELOG.md"
Design = "https://github.com/JeremiahM37/action-receipt/blob/main/docs/DESIGN.md"

[tool.setuptools.packages.find]
include = ["action_receipt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: pure-Python tests, no browser (tests/unit)",
  "integration: browser tests against the local fixture pages (tests/integration)",
  "e2e: end-to-end through the real MCP stdio server and a real Chromium (tests/e2e)",
  "slow: needs something outside the repo (the Ollama agent endpoint, or npx and the npm registry); skips itself when it is unavailable",
]

[tool.coverage.run]
source = ["action_receipt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["bench/results", "bench/fixtures", "tests/fixtures", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is the formatter's job; long strings and tables stay readable
  "E731",   # lambdas assigned to names are used deliberately in the bench task tables
  "SIM105", # try/except/pass is clearer than contextlib.suppress around browser calls
  "SIM117", # nested `async with` blocks read better than one long line
  "RUF001", # typographic × − … in strings and comments are intentional
  "RUF002",
  "RUF003",
  "RUF005", # [a] + b is fine
  "RUF012", # mutable class attributes are dataclass fields here
  "B008",   # pydantic Field(...) in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017"]
"bench/**" = ["B007", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["action_receipt", "bench", "tests"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false

[tool.mypy]
python_version = "3.11"
files = ["action_receipt"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
