name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  lint:
    name: lint (ruff, format, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      # No browser is installed on purpose: the unit tier must not need one.
      - run: python -m pytest -q -p no:cacheprovider -m unit tests/unit --junitxml=junit-unit-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-unit-py${{ matrix.python }}
          path: junit-unit-*.xml

  integration:
    name: integration (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - name: Resolve the Playwright version (the browser cache key)
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: python -m playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: python -m playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: python -m pytest -q -p no:cacheprovider -m integration tests --junitxml=junit-integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results
          path: |
            junit-integration.xml
            test-results/
            **/*.trace.zip
            **/*failure*.png
          if-no-files-found: ignore

  e2e:
    name: e2e (MCP stdio + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - name: Resolve the Playwright version (the browser cache key)
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: python -m playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: python -m playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: python -m pytest -q -p no:cacheprovider -m e2e tests --junitxml=junit-e2e.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            junit-e2e.xml
            test-results/
            **/*.trace.zip
            **/*failure*.png
          if-no-files-found: ignore

  coverage:
    name: coverage (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - name: Resolve the Playwright version (the browser cache key)
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: python -m playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: python -m playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: >
          python -m pytest -q -p no:cacheprovider -m "unit or integration" tests
          --cov=action_receipt --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Coverage summary
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  bench-smoke:
    # A <= 2 minute subset of the benchmark suite (overhead n=5, settlement 2 delays, accuracy 10
    # cases): local fixtures only, no Ollama, no network. Not a gate on numbers - it proves the
    # bench code still runs and publishes the tables it wrote.
    name: bench smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[bench]'
      - name: Resolve the Playwright version (the browser cache key)
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: python -m playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: python -m playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: PY=python bench/smoke.sh
        env:
          AR_BENCH_RESULTS: bench/results/smoke
      - name: Smoke tables
        run: |
          for f in bench/results/smoke/*.md; do
            echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            head -c 20000 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-smoke-results
          path: |
            bench/results/smoke/*.md
            bench/results/smoke/*.json
            bench/results/smoke/logs/
