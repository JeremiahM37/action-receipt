# CodeQL runs on pushes to main and on a weekly schedule only. It is deliberately NOT run on
# pull_request: its findings are false-positive-prone and must never gate a PR.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
