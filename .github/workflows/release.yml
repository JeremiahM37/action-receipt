name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Check the tag matches the package version
        run: |
          ver=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$ver" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version $ver"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  test-wheel:
    name: unit tests against the wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the wheel (not the source tree) plus the test extra
        run: |
          python -m pip install dist/*.whl
          python -m pip install pytest pytest-asyncio
          action-receipt --help
      - name: Run the unit tier against the installed package
        # Move away from the checkout root so `import action_receipt` resolves to the wheel.
        run: |
          mkdir -p /tmp/wheeltest && cp -r tests pyproject.toml /tmp/wheeltest/
          cd /tmp/wheeltest && python -c 'import action_receipt, os; assert "site-packages" in action_receipt.__file__, action_receipt.__file__'
          cd /tmp/wheeltest && python -m pytest -q -p no:cacheprovider -m unit tests/unit

  release:
    name: GitHub release
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract this version's CHANGELOG section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "No CHANGELOG section for $ver" > release-notes.md; fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: false

  # PyPI publishing is deliberately not enabled: no trusted publisher is configured for this
  # project yet. To enable it:
  #   1. On PyPI, create the project and add a Trusted Publisher for
  #      owner "JeremiahM37", repository "action-receipt", workflow "release.yml", environment "pypi".
  #   2. In the repository settings, create an environment named "pypi".
  #   3. Uncomment the job below. It needs no API token - OIDC does the authentication.
  #
  # publish:
  #   name: publish to PyPI
  #   needs: [build, test-wheel]
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: dist
  #         path: dist
  #     - uses: pypa/gh-action-pypi-publish@release/v1
